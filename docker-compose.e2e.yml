# MongoDB only — for CI and local E2E/integration without backend/.env.dev.
name: nameless-dashboard-e2e

services:
    mongo:
        image: mongo:7
        command: mongod --replSet rs0
        ports:
            - '27017:27017'
        healthcheck:
            test: |
                mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
            start_period: 120s
            start_interval: 10s
            interval: 7200s
            timeout: 10s
            retries: 10
