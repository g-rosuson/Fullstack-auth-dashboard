name: Reusable E2E tests

on:
    workflow_call:

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Start MongoDB (single-node replica set)
              run: docker compose -f docker-compose.e2e.yml up -d mongo --wait

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      frontend/package-lock.json
                      backend/package-lock.json

            - name: Install root dependencies
              run: npm ci

            - name: Install frontend dependencies
              run: npm ci
              working-directory: frontend

            - name: Install backend dependencies
              run: npm ci
              working-directory: backend

            - name: Verify MongoDB for E2E
              run: bash .github/scripts/verify-mongo-e2e.sh

            - name: Build backend for E2E
              run: npm run build
              working-directory: backend

            - name: Start backend and wait for health
              run: bash .github/scripts/start-e2e-backend.sh

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: Run E2E tests
              run: npm run test:e2e
              env:
                  CI: true

            - name: Stop backend
              if: always()
              run: bash .github/scripts/stop-e2e-backend.sh

            - name: Upload Playwright report
              if: success() || failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  if-no-files-found: warn

            - name: Upload Playwright test results
              if: success() || failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-test-results
                  path: test-results/
                  if-no-files-found: warn

            - name: Upload backend log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-e2e-log
                  path: backend-e2e.log
                  if-no-files-found: warn
